name: Build

# Every push and pull request: build the helper DLLs (x64 + ARM64), OpacityBar.exe and
# OpacityBarSetup.exe, and keep them as a short-lived run artifact.
# A version tag (v1.2.3) additionally publishes a GitHub Release with the installer, a
# portable zip and checksums. The tag must match AppInfo.Version in src/AppInfo.cs.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and package
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path src/AppInfo.cs -Pattern 'const string Version = "([0-9]+\.[0-9]+\.[0-9]+)"'
          if (-not $m) { throw "AppInfo.Version not found in src/AppInfo.cs" }
          $v = $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match AppInfo.Version $v. Bump src/AppInfo.cs (and CHANGELOG.md) first."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "OpacityBar $v"

      - name: Compile helper DLLs (x64 + ARM64)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found" }
          New-Item -ItemType Directory -Force dist | Out-Null

          $targets = @(
            @{ arch = 'x64';   vc = 'x64';         machine = '8664' },
            @{ arch = 'arm64'; vc = 'amd64_arm64'; machine = 'AA64' }
          )
          foreach ($t in $targets) {
            $obj = "obj_$($t.arch)"
            New-Item -ItemType Directory -Force $obj | Out-Null
            $dll = "dist\OpacityBarTAP.$($t.arch).dll"
            # C++/WinRT (blur brush) comes from the Windows SDK. windowsapp.lib last so it only supplies
            # the WinRT core imports; dxguid.lib = D2D1 effect CLSIDs.
            $cmd = "`"$vcvars`" $($t.vc) >nul && " +
                   "cl /nologo /LD /O2 /std:c++20 /EHsc /permissive- /bigobj /GS /guard:cf /W4 /DUNICODE /D_UNICODE " +
                   "/Fo$obj\ native\OpacityBarTAP.cpp /Fe:$dll " +
                   "/link /DEF:native\OpacityBarTAP.def /GUARD:CF /DYNAMICBASE /NXCOMPAT " +
                   "kernel32.lib ole32.lib oleaut32.lib user32.lib dxguid.lib windowsapp.lib && " +
                   "dumpbin /nologo /headers $dll > $obj\headers.txt && " +
                   "dumpbin /nologo /exports $dll > $obj\exports.txt"
            cmd /c $cmd
            if ($LASTEXITCODE -ne 0) { throw "Building $dll failed (exit $LASTEXITCODE)" }

            $headers = Get-Content "$obj\headers.txt" -Raw
            if ($headers -notmatch "$($t.machine) machine") { Write-Host $headers; throw "Unexpected machine type for $dll" }
            $exports = Get-Content "$obj\exports.txt" -Raw
            foreach ($e in 'DllGetClassObject', 'DllCanUnloadNow') {
              if ($exports -notmatch "\b$e\b") { throw "Missing export $e in $dll" }
            }
          }

      - name: Compile OpacityBar.exe and OpacityBarSetup.exe
        shell: pwsh
        run: |
          ./build.ps1
          foreach ($f in "OpacityBar.exe", "OpacityBarSetup.exe") {
            if (-not (Test-Path "dist/$f")) { throw "dist/$f was not generated!" }
          }

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release, portable | Out-Null
          Copy-Item dist/OpacityBarSetup.exe "release/OpacityBar-$v-Setup.exe"
          Copy-Item dist/OpacityBar.exe, dist/OpacityBarTAP.x64.dll, dist/OpacityBarTAP.arm64.dll, LICENSE portable/
          Compress-Archive -Force -Path portable/* -DestinationPath "release/OpacityBar-$v-Portable.zip"
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      # Short-lived copy on the run page for testing. Never fails the build if storage is full.
      - name: Upload build
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: OpacityBar-${{ steps.version.outputs.version }}-build
          path: release/
          retention-days: 7
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          # Release notes = this version's section of CHANGELOG.md.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          # Drop link-reference lines ("[1.1.0]: https://...") and make repo-relative links absolute.
          $body = ($body -split "`n" | Where-Object { $_ -notmatch '^\[[^\]]+\]:\s*http' }) -join "`n"
          $body = [regex]::Replace($body, '\]\((?!https?:)([^)]+)\)', '](https://github.com/${{ github.repository }}/blob/main/$1)')
          $body += "`n`n### Download`n`n- **OpacityBar-$v-Setup.exe**: recommended. Installs for your account only (no admin rights), updates an existing install.`n- **OpacityBar-$v-Portable.zip**: unzip anywhere and run OpacityBar.exe.`n- **SHA256SUMS.txt**: checksums.`n`nWindows SmartScreen may warn because the files are not code-signed yet: choose *More info > Run anyway*."
          $body | Out-File -FilePath notes.md -Encoding utf8

          # The old rolling "Latest build" pre-release is replaced by versioned releases.
          gh release delete latest-build --yes --cleanup-tag 2>$null

          gh release create "${{ github.ref_name }}" --title "OpacityBar $v" --notes-file notes.md --verify-tag `
            "release/OpacityBar-$v-Setup.exe" "release/OpacityBar-$v-Portable.zip" release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed" }
