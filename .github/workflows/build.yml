name: Build Opacbar

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # One job builds everything: the native helper (native/OpacbarTAP.cpp) for x64
  # and ARM64 with MSVC, and Opacbar.exe with the built-in .NET Framework csc.
  # No intermediate artifacts, so the private-repo artifact quota is barely used.
  # ---------------------------------------------------------------------------
  build:
    name: Build and package Opacbar
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Compile helper DLLs (x64 + ARM64)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found" }
          New-Item -ItemType Directory -Force dist | Out-Null

          $targets = @(
            @{ arch = 'x64';   vc = 'x64';         machine = '8664' },
            @{ arch = 'arm64'; vc = 'amd64_arm64'; machine = 'AA64' }
          )
          foreach ($t in $targets) {
            $obj = "obj_$($t.arch)"
            New-Item -ItemType Directory -Force $obj | Out-Null
            $dll = "dist\OpacbarTAP.$($t.arch).dll"
            # C++/WinRT (blur brush) comes from the Windows SDK (include\<ver>\cppwinrt, on the
            # vcvars INCLUDE path). Explicit system libs first, windowsapp.lib last so it only
            # supplies the WinRT core imports; dxguid.lib = D2D1 effect CLSIDs (static data).
            $cmd = "`"$vcvars`" $($t.vc) >nul && " +
                   "cl /nologo /LD /O2 /std:c++17 /EHsc /permissive- /bigobj /GS /guard:cf /W4 /DUNICODE /D_UNICODE " +
                   "/Fo$obj\ native\OpacbarTAP.cpp /Fe:$dll " +
                   "/link /DEF:native\OpacbarTAP.def /GUARD:CF /DYNAMICBASE /NXCOMPAT " +
                   "kernel32.lib ole32.lib oleaut32.lib user32.lib dxguid.lib windowsapp.lib && " +
                   "dumpbin /nologo /headers $dll > $obj\headers.txt && " +
                   "dumpbin /nologo /exports $dll > $obj\exports.txt"
            cmd /c $cmd
            if ($LASTEXITCODE -ne 0) { throw "Building $dll failed (exit $LASTEXITCODE)" }

            # Sanity checks: correct machine type and exactly the two expected exports.
            $headers = Get-Content "$obj\headers.txt" -Raw
            if ($headers -notmatch "$($t.machine) machine") { Write-Host $headers; throw "Unexpected machine type for $dll" }
            $exports = Get-Content "$obj\exports.txt" -Raw
            Write-Host $exports
            foreach ($e in 'DllGetClassObject', 'DllCanUnloadNow') {
              if ($exports -notmatch "\b$e\b") { throw "Missing export $e in $dll" }
            }
          }

      - name: Compile Opacbar.exe
        shell: pwsh
        run: |
          ./build.ps1
          if (-not (Test-Path "dist/Opacbar.exe")) { throw "dist/Opacbar.exe was not generated!" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed" }
          }
          & $iscc /Q installer\Opacbar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/OpacbarSetup.exe")) { throw "dist/OpacbarSetup.exe was not generated!" }

      - name: Checksums and portable ZIP
        shell: pwsh
        run: |
          $files = "OpacbarSetup.exe", "Opacbar.exe", "OpacbarTAP.x64.dll", "OpacbarTAP.arm64.dll"
          foreach ($f in $files) {
            if (-not (Test-Path "dist/$f")) { throw "dist/$f is missing!" }
          }
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLowerInvariant(), $f
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8
          Get-Content "dist/SHA256SUMS.txt"

          Copy-Item "README.md" -Destination "dist/README.md"
          Copy-Item "LICENSE" -Destination "dist/LICENSE"
          Compress-Archive -Force -DestinationPath "dist/Opacbar-Windows-Portable.zip" -Path `
            "dist/Opacbar.exe", "dist/OpacbarTAP.x64.dll", "dist/OpacbarTAP.arm64.dll", `
            "dist/SHA256SUMS.txt", "dist/README.md", "dist/LICENSE"

      # Short-lived copy on the run page. Never fails the build if the storage quota is full.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: Opacbar-Windows
          path: dist/Opacbar-Windows-Portable.zip
          retention-days: 3
          if-no-files-found: error

      # Rolling "Latest build" pre-release, updated on every push to main. Release assets do
      # not count against the Actions artifact quota. Find it under Releases on the repo page.
      - name: Update "Latest build" pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Automatic build of commit ${{ github.sha }}. Recommended: run OpacbarSetup.exe (installs for your account, no admin). Portable: unzip Opacbar-Windows-Portable.zip and run Opacbar.exe."
          gh release delete latest-build --yes --cleanup-tag 2>$null
          gh release create latest-build --prerelease --title "Latest build" --notes $notes --target ${{ github.sha }} `
            dist/OpacbarSetup.exe dist/Opacbar-Windows-Portable.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Creating the Latest build release failed" }

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/OpacbarSetup.exe
            dist/Opacbar.exe
            dist/OpacbarTAP.x64.dll
            dist/OpacbarTAP.arm64.dll
            dist/Opacbar-Windows-Portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
